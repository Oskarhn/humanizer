name: Publish skill release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python scripts/validate_package.py
      - run: python -m unittest discover -s tests -v
      - name: Build and check tag
        run: python scripts/build_release.py --check-tag "$GITHUB_REF_NAME"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip dist/*.sha256
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "Humanizer ${GITHUB_REF_NAME#v}"
          --notes-file "docs/release-notes/${GITHUB_REF_NAME#v}.md"
